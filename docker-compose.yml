services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongoadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-example}
    volumes:
      - mongo_data:/data/db

  python-service:
    build: ./python-service
    environment:
      - PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    restart: always

  backend:
    build: ./backend
    ports:
      - "3000:4000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - PYTHON_SERVICE_URL=http://python-service:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - python-service
      - mongo

  frontend:
    build: ./frontend
    restart: always

  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
